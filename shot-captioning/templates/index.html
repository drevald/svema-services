<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shot Captioning Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .model-info {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 10px;
        }
        .model-info strong {
            color: #667eea;
        }
        .upload-form {
            margin-bottom: 30px;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
        }
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        .file-input-label {
            display: block;
            padding: 20px;
            background: #f7f7f7;
            border: 2px dashed #667eea;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-input-label:hover {
            background: #efefff;
            border-color: #764ba2;
        }
        .file-input-label.has-file {
            background: #efefff;
            border-color: #667eea;
            border-style: solid;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 30px;
        }
        .result-image {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .caption-box {
            padding: 20px;
            background: #f7f7f7;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            font-size: 1.1em;
            color: #333;
            line-height: 1.6;
        }
        .error {
            padding: 15px;
            background: #fee;
            border-left: 4px solid #e33;
            border-radius: 5px;
            color: #c33;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shot Captioning</h1>
        <div class="model-info">
            <p><strong>Model:</strong> {{ model_name }}</p>
            <p><strong>Device:</strong> {{ device }}</p>
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" class="upload-form" id="uploadForm">
            <div class="file-input-wrapper">
                <input type="file" name="image" id="imageInput" accept="image/*" required>
                <label for="imageInput" class="file-input-label" id="fileLabel">
                    <span id="labelText">Click to select an image or drag and drop</span>
                </label>
            </div>
            <button type="submit" class="submit-btn">Generate Caption</button>
        </form>

        {% if caption %}
        <div class="result">
            <img src="data:image/jpeg;base64,{{ image_data }}" alt="Uploaded image" class="result-image">
            <div class="caption-box">
                <strong>Caption:</strong> {{ caption }}
            </div>
        </div>
        {% endif %}
    </div>

    <script>
        const fileInput = document.getElementById('imageInput');
        const fileLabel = document.getElementById('fileLabel');
        const labelText = document.getElementById('labelText');

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                labelText.textContent = 'Selected: ' + e.target.files[0].name;
                fileLabel.classList.add('has-file');
            } else {
                labelText.textContent = 'Click to select an image or drag and drop';
                fileLabel.classList.remove('has-file');
            }
        });

        // Drag and drop
        fileLabel.addEventListener('dragover', function(e) {
            e.preventDefault();
            fileLabel.style.borderColor = '#764ba2';
            fileLabel.style.background = '#efefff';
        });

        fileLabel.addEventListener('dragleave', function(e) {
            e.preventDefault();
            fileLabel.style.borderColor = '#667eea';
            fileLabel.style.background = '#f7f7f7';
        });

        fileLabel.addEventListener('drop', function(e) {
            e.preventDefault();
            fileLabel.style.borderColor = '#667eea';
            fileLabel.style.background = '#f7f7f7';

            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                labelText.textContent = 'Selected: ' + e.dataTransfer.files[0].name;
                fileLabel.classList.add('has-file');
            }
        });
    </script>
</body>
</html>
