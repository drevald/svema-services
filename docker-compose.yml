version: '3.8'

services:
  face-recognition:
    build: ./face-recognition
    container_name: svema-face-recognition
    ports:
      - "5555:5555"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - svema-network

  shot-captioning:
    build: ./shot-captioning
    container_name: svema-shot-captioning
    ports:
      - "5556:5556"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://192.168.0.134:11434
      - MODEL_NAME=qwen2.5vl:7b
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - svema-network
    depends_on:
      - face-recognition

networks:
  svema-network:
    external: true
    name: svema_svema-network
